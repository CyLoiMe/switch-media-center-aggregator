name: portlib-drift

# Weekly, read-only. Compares the Switch portlibs this build installs (pinned by
# exact filename in switch.yaml) against GMCA's scripts/switch — the fork those
# binaries were built from, i.e. the only place where someone else has already
# done the version-locked patch rebase — and against the libraries' own latest
# releases, where security fixes land.
#
# It builds nothing and bumps nothing. Its only output is one issue that shows how
# far behind the frozen binaries are, so a security release or a new libmpv
# requirement does not arrive unnoticed.
on:
  schedule:
    - cron: '0 1 * * 1'   # Mondays 01:00 UTC
  workflow_dispatch:
  # editing the checker itself runs it once, so a change is proven then and there
  push:
    paths:
      - '.github/workflows/portlib-drift.yaml'
      - 'scripts/check-portlib-drift.sh'

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Compare pinned versions with GMCA and upstream
      id: check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash scripts/check-portlib-drift.sh

    - name: Keep one issue in sync with the report
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        # A repository can have Issues switched off (this one does): then there is
        # nowhere to write, and no permission setting changes that. Say so once and
        # keep the run green — the report is already in this job's summary.
        if [ "$(gh repo view --json hasIssuesEnabled --jq .hasIssuesEnabled)" != "true" ]; then
          echo "::warning title=Issues are disabled::The drift report is in this run's Summary. Enable Issues in the repository settings to have it tracked as an issue."
          exit 0
        fi

        num=$(gh issue list --state open --limit 100 --json number,title \
                --jq '.[] | select(.title | startswith("Portlib drift")) | .number' | head -1)

        # Nothing behind: one issue must not outlive the condition it reports.
        if [ "${{ steps.check.outputs.drift }}" != "true" ]; then
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "Every portlib is at or ahead of upstream again. This issue comes back by itself if that changes."
            echo "closed #$num: nothing drifted"
          else
            echo "nothing drifted, no issue to close"
          fi
          exit 0
        fi

        body=$(cat portlib-drift.md)
        if [ -n "$num" ]; then
          # Compare the TABLE only: the "Snapshot" line changes every run, and
          # rewriting the body just to bump a date is exactly the noise to avoid.
          if diff -q <(grep -v '^Snapshot ' <<<"$(gh issue view "$num" --json body --jq .body)") \
                     <(grep -v '^Snapshot ' <<<"$body") >/dev/null; then
            echo "table unchanged since #$num — leaving it alone"
            exit 0
          fi
          echo "table changed — updating #$num"
          gh issue edit "$num" --body "$body" || exit 1
        else
          echo "opening the drift issue"
          gh issue create --title "Portlib drift: newer releases are available" --body "$body" || exit 1
        fi
