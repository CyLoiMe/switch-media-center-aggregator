name: switch

# SMCA ships one platform: Nintendo Switch (Atmosphère). This replaces the
# multi-platform matrix the project inherited from GMCA.
on:
  push:
    branches: [ main ]
    # a tag push builds once and then publishes that artifact as the release the
    # in-app updater reads (it calls /releases/latest, which ignores prereleases)
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      driver:
        description: "render backend"
        type: choice
        options: [ deko3d, opengl ]
        default: deko3d
      no_forwarder:
        description: "skip the built-in NSP forwarder"
        type: boolean
        default: false

env:
  # The Switch portlibs this build installs. They are mirrored, byte for byte,
  # from GMCA's ci-deps into this repository's own `switch-portlibs` prerelease
  # (sha256 checked), so the build no longer depends on another project's release.
  #
  # The mirror is a snapshot, not a rebuild: scripts/switch/* still pins
  # ffmpeg 7.1.4 / mbedtls 3.6.5 / dav1d 1.5.3, and the devkitPro port patches are
  # version-locked, so the workflow cannot yet reproduce the names below. Bumping
  # them is its own task — see docs/backlog.md, "Make the mirrored portlibs
  # rebuildable".
  DEPS_URL: https://github.com/CyLoiMe/switch-media-center-aggregator/releases/download/switch-portlibs

jobs:
  logic:
    # The host-compiled pure logic (tests/run.sh): the HTTP parser behind the LAN
    # config portal, the draft it edits, and the older header-only pieces. They run
    # here because a parser regression should cost a minute, not a full console
    # toolchain build — and because the console build cannot exercise "reject this
    # malformed request" without a device.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        # the tests include nlohmann from borealis' tree (it lives in the submodule)
        submodules: recursive
    - name: Run logic tests
      run: |
        set +e
        bash tests/run.sh 2>&1 | tee /tmp/logic.txt
        rc=${PIPESTATUS[0]}
        if [ "$rc" -ne 0 ]; then
          # Annotations are readable without a token (the job log is not), so a
          # failure here can be diagnosed from anywhere.
          tail -n 40 /tmp/logic.txt | sed 's/^/::error::/' || true
        fi
        exit "$rc"

  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Apply borealis patches
      run: |
        git config --global --add safe.directory '*'
        git -C library/borealis apply --verbose ../../scripts/patches/borealis-fixes.patch

    - name: Select render backend
      run: |
        DRIVER="${{ github.event.inputs.driver || 'deko3d' }}"
        if [ "$DRIVER" = "deko3d" ]; then
          echo "CMAKE_DRIVER=-DUSE_DEKO3D=ON" >> "$GITHUB_ENV"
          echo "SHUFFIX=-deko3d" >> "$GITHUB_ENV"
          dkp-pacman --noconfirm -R switch-libmpv
          dkp-pacman --noconfirm -U $DEPS_URL/libuam-master-1-any.pkg.tar.zst
        fi
        echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"

    - name: Update dependencies
      run: |
        dkp-pacman --noconfirm -U $DEPS_URL/hacBrewPack-3.05-1-x86_64.pkg.tar.zst
        for pkg in mbedtls-3.6.7-1 libssh2-1.11.1-1 dav1d-1.5.4-1 curl-8.16.0-3 \
                   ffmpeg-7.1.5-5 libmpv${{ env.SHUFFIX }}-0.36.0-5 nspmini-main-1; do
          dkp-pacman --noconfirm -U $DEPS_URL/switch-${pkg}-any.pkg.tar.zst
        done
        git config --system --add safe.directory $GITHUB_WORKSPACE

    - name: Build libusbhsfs (UMS/USB drive support)
      run: |
        git clone https://github.com/DarkMatterCore/libusbhsfs.git --depth=1
        make -C libusbhsfs BUILD_TYPE=GPL install -j$(nproc)

    - name: Build NRO
      run: |
        set +e
        (
          cmake -B build ${{ env.CMAKE_DRIVER }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_SWITCH=ON \
            -DUSE_LIBUSBHSFS=ON \
            -DBUILTIN_NSP=${{ github.event.inputs.no_forwarder && 'OFF' || 'ON' }} \
            -DVERSION_BUILD=${{ github.run_number }} &&
          make -C build SMCA.nro -j$(nproc)
        ) 2>&1 | tee /tmp/build.txt
        rc=${PIPESTATUS[0]}
        if [ "$rc" -ne 0 ]; then
          # Compiler diagnostics as annotations: `error:` lines first, then the tail.
          grep -E "error:|Error " /tmp/build.txt | head -n 20 | sed 's/^/::error::/' || true
          tail -n 20 /tmp/build.txt | sed 's/^/::error::/' || true
        fi
        exit "$rc"

    - name: Upload NRO
      uses: actions/upload-artifact@v6
      with:
        name: SMCA-NintendoSwitch${{ env.SHUFFIX }}-${{ github.run_number }}
        path: build/SMCA.nro

    - name: Upload debug ELF
      uses: actions/upload-artifact@v6
      with:
        name: SMCA-dev-elf-${{ env.DRIVER }}-${{ github.run_number }}
        path: build/SMCA.elf

  release:
    # Tags only. The updater asks GitHub for /releases/latest, which ignores
    # prereleases and needs an asset ending in .nro; this job produces exactly
    # that, with the matching CHANGELOG section as the release body (the app shows
    # it in the update dialog).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v6
      with:
        pattern: SMCA-NintendoSwitch*
        # without this the archive lands in dist/<artifact-name>/SMCA.nro and the
        # files: glob below matches nothing
        merge-multiple: true
        path: dist

    - name: Take the CHANGELOG section for this tag
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk -v v="$version" '
          index($0, "## [" v "]") == 1 { found = 1; next }
          found && index($0, "## [") == 1 { exit }
          found { print }
        ' CHANGELOG.md > notes.md
        if [ ! -s notes.md ]; then
          echo "SMCA ${version}." > notes.md
          echo "::warning::no CHANGELOG section for ${version}"
        fi
        # every '## [x.y.z]' heading is followed by a blank line; drop it so the
        # release body does not start with two empty lines
        sed '/./,$!d' notes.md > notes.trimmed.md
        { echo "## What's in this build"; echo; cat notes.trimmed.md; } > body.md

    - name: Publish release
      uses: softprops/action-gh-release@v3
      with:
        name: SMCA ${{ github.ref_name }}
        body_path: body.md
        files: dist/SMCA.nro
        fail_on_unmatched_files: true
        prerelease: false
